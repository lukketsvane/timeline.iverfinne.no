name: Verify icon-only FUGLESPRENGER UI
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage(), errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res&&res.status()));
            await page.waitForTimeout(2500);
            const state=await page.evaluate(()=>({
              title:document.title,
              hidden:['gameTitle','blastHud','gardenHud','gardenHint','roundHud'].map(id=>[id,getComputedStyle(document.getElementById(id)).display]),
              perk:getComputedStyle(document.getElementById('perkMenu')).bottom,
              text:['gameTitle','blastHud','gardenHud','gardenHint','roundHud'].map(id=>document.getElementById(id).textContent),
              viewport:document.querySelector('meta[name=viewport]').content
            }));
            console.log(JSON.stringify(state));
            if(state.title!=='MAX FUGLESPRENGER')throw new Error('title');
            if(state.hidden.some(x=>x[1]!=='none'))throw new Error('text HUD visible');
            if(!state.viewport.includes('viewport-fit=cover'))throw new Error('viewport');
            if(errors.length)throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
