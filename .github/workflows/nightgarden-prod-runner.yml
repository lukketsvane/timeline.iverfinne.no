name: Probe candidate hosts
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in https://cells.garden https://tv.iverfinne.no https://slicer.iverfinne.no https://50x50x50.iverfinne.no https://mbti-tesseract.iverfinne.no; do
            echo "=== $u ==="
            curl -sSIL --max-time 15 "$u" | head -12
          done
