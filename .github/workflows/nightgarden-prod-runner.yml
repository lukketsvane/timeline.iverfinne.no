name: Verify smart Night Garden
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(2500);
            console.log('STATUS',res.status(),'TITLE',await page.title());
            const canvas=await page.locator('#c').evaluate(el=>({w:el.width,h:el.height,cssW:el.style.width,cssH:el.style.height,left:el.style.left,top:el.style.top}));
            console.log('CANVAS',JSON.stringify(canvas));
            await page.keyboard.down('Shift');
            await page.keyboard.down('ArrowRight');
            await page.waitForTimeout(14500);
            await page.keyboard.up('ArrowRight');
            await page.keyboard.up('Shift');
            await page.waitForTimeout(1200);
            const x=await page.evaluate(()=>localStorage.getItem('max-night-garden-x'));
            const mind=await page.evaluate(()=>localStorage.getItem('max-night-garden-mind'));
            console.log('SAVED_X',x);
            console.log('MIND',mind);
            const box=await page.locator('#stage').boundingBox();
            await page.mouse.move(box.x+box.width*.56,box.y+box.height*.68);
            await page.mouse.down();
            await page.waitForTimeout(650);
            await page.mouse.up();
            await page.waitForTimeout(1000);
            console.log('ERRORS',JSON.stringify(errors));
            if(!x || +x < 700) throw new Error('player did not travel far enough');
            if(!mind || !mind.includes('meadow')) throw new Error('world mind did not persist biome discovery');
            if(errors.length) throw new Error(errors.join('\n'));
            await page.screenshot({path:'/tmp/smart-night-garden.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-night-garden-proof
          path: /tmp/smart-night-garden.png
          if-no-files-found: ignore
