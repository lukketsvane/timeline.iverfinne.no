name: Verify MAX FUGLESPRENGER roguelite
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res&&res.status()));
            await page.waitForTimeout(1800);
            const title=await page.title();
            const before=await page.locator('#gardenHud').innerText();
            if(title!=='MAX FUGLESPRENGER')throw new Error('wrong title '+title);
            if(!/^FRØ 0\b/.test(before))throw new Error('run did not start with 0 seeds: '+before);

            await page.keyboard.down('ArrowRight');
            await page.waitForTimeout(1900);
            await page.keyboard.up('ArrowRight');
            await page.waitForTimeout(900);
            const after=await page.locator('#gardenHud').innerText();
            const m=after.match(/^FRØ (\d+)/);
            if(!m||+m[1]<1)throw new Error('seed pickup loop failed: '+after);

            await page.keyboard.down('ArrowRight');
            await page.waitForTimeout(600);
            await page.keyboard.up('ArrowRight');
            await page.keyboard.press('ArrowUp');
            await page.waitForTimeout(500);

            console.log('TITLE',title);
            console.log('BEFORE',before.replace(/\n/g,' | '));
            console.log('AFTER',after.replace(/\n/g,' | '));
            console.log('ERRORS',JSON.stringify(errors));
            if(errors.length)throw new Error(errors.join('\n'));
            await page.screenshot({path:'max-fuglesprenger-rogue.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: max-fuglesprenger-roguelite-verification
          path: max-fuglesprenger-rogue.png
          if-no-files-found: ignore
