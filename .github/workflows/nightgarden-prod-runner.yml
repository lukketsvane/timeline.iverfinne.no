name: Verify ecology Night Garden
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            let res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res&&res.status()));
            await page.waitForTimeout(1800);

            const positions=[0,470,930,1390,1850,2310,2770,3230];
            for(const x of positions){
              await page.evaluate(v=>localStorage.setItem('max-night-garden-x',String(v)),x);
              await page.reload({waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForTimeout(900);
              const title=await page.title();
              if(title!=='Max in the Night Garden')throw new Error('bad title at '+x);
            }

            await page.keyboard.down('ArrowRight');await page.waitForTimeout(1200);await page.keyboard.up('ArrowRight');
            await page.keyboard.press('ArrowUp');await page.waitForTimeout(650);
            const box=await page.locator('#stage').boundingBox();if(!box)throw new Error('no stage');
            await page.mouse.move(box.x+box.width*.58,box.y+box.height*.62);
            await page.mouse.down();await page.waitForTimeout(560);await page.mouse.up();
            await page.waitForTimeout(1500);

            const state=await page.evaluate(()=>({
              title:document.title,
              canvas:[document.querySelector('#c').width,document.querySelector('#c').height],
              style:[document.querySelector('#c').style.width,document.querySelector('#c').style.height],
              mind:localStorage.getItem('max-night-garden-mind'),
              x:localStorage.getItem('max-night-garden-x')
            }));
            console.log('STATE',JSON.stringify(state));
            console.log('ERRORS',JSON.stringify(errors));
            if(errors.length)throw new Error(errors.join('\n'));
            await page.screenshot({path:'nightgarden-ecology.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightgarden-ecology-verification
          path: nightgarden-ecology.png
          if-no-files-found: ignore
