name: Verify finished garden loop
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res&&res.status()));
            await page.waitForTimeout(2200);
            if((await page.title())!=='MAX FUGLESPRENGER')throw new Error('wrong title');
            await page.evaluate(()=>{localStorage.removeItem('max-fuglesprenger-garden-v1')});
            await page.reload({waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(1600);

            await page.keyboard.press('e');
            await page.waitForTimeout(2200);
            let garden=JSON.parse(await page.evaluate(()=>localStorage.getItem('max-fuglesprenger-garden-v1')));
            if(!garden||!garden.plots||garden.plots.length<1)throw new Error('seed was not planted');
            if(garden.seeds!==7)throw new Error('seed count did not decrease: '+garden.seeds);

            await page.keyboard.press('e');
            await page.waitForTimeout(2000);
            garden=JSON.parse(await page.evaluate(()=>localStorage.getItem('max-fuglesprenger-garden-v1')));
            if(garden.plots[0].moisture<.85)throw new Error('watering failed '+garden.plots[0].moisture);

            await page.waitForTimeout(7000);
            const hud=await page.locator('#gardenHud').innerText();
            const hint=await page.locator('#gardenHint').innerText();
            console.log('HUD',hud);
            console.log('HINT',hint);
            console.log('GARDEN',JSON.stringify(garden));
            console.log('ERRORS',JSON.stringify(errors));
            if(errors.length)throw new Error(errors.join('\n'));
            await page.screenshot({path:'max-fuglesprenger-garden-final.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: max-fuglesprenger-garden-final
          path: max-fuglesprenger-garden-final.png
          if-no-files-found: ignore
