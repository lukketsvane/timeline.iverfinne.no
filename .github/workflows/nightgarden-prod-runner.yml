name: Verify max final
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 -D /tmp/headers https://max.iverfinne.no -o /tmp/page
          head -20 /tmp/headers
          grep -o '<title>[^<]*</title>' /tmp/page | head -1
          wc -c /tmp/page
          grep -q 'Max in the Night Garden' /tmp/page
          echo LIVE_OK_MIDDLEWARE
