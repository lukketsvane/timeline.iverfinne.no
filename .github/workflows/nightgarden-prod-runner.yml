name: Verify updated Night Garden
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 2 -D /tmp/headers https://max.iverfinne.no/ -o /tmp/page
          echo "=== HEADERS ==="
          head -30 /tmp/headers
          echo "=== CHECKS ==="
          grep -o '<title>[^<]*</title>' /tmp/page | head -1
          bytes=$(wc -c < /tmp/page)
          echo "BYTES=$bytes"
          grep -q 'Max in the Night Garden' /tmp/page
          grep -q 'SHEET_SRC' /tmp/page
          test "$bytes" -gt 300000
          echo "UPDATED_NIGHT_GARDEN_LIVE"
