name: Verify ants Night Garden
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 https://max.iverfinne.no/ -o /tmp/page
          grep -q 'ANT1_SRC' /tmp/page
          grep -q 'function updateAnts' /tmp/page
          grep -q 'function drawAnts' /tmp/page
          grep -q 'ant_walk' /tmp/page || true
          echo "ANTS_SOURCE_PRESENT"
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res&&res.status()));
            await page.waitForTimeout(3500);
            await page.keyboard.down('ArrowRight'); await page.waitForTimeout(1000); await page.keyboard.up('ArrowRight');
            await page.keyboard.press('ArrowUp'); await page.waitForTimeout(800);
            const b=await page.locator('#stage').boundingBox(); if(!b)throw new Error('stage missing');
            await page.mouse.move(b.x+b.width*.55,b.y+b.height*.64);
            await page.mouse.down(); await page.waitForTimeout(560); await page.mouse.up();
            await page.waitForTimeout(1200);
            console.log('TITLE',await page.title());
            console.log('ERRORS',JSON.stringify(errors));
            if(errors.length)throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
