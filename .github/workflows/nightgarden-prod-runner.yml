name: Night Garden Vercel prod runner
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare prebuilt Night Garden
        run: |
          set -euo pipefail
          mkdir -p app/.vercel/output/static
          curl -fsSL "https://raw.githubusercontent.com/lukketsvane/iverfinne.no/nightgarden-prod-20260921/.nightgarden-deploy/.vercel/output/static/index.html" -o app/.vercel/output/static/index.html
          printf '%s' '{"version":3}' > app/.vercel/output/config.json
          printf '%s' '{"orgId":"team_6ukeAMsNaWMRhHombsc7EIwn","projectId":"prj_XSjxkxAinLDTqN6avq3zTF4Vx2sl","projectName":"v0-image-analysis-xy_gitless"}' > app/.vercel/project.json
          test -s app/.vercel/output/static/index.html

      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Exchange OIDC and deploy production
        working-directory: app
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          OUT="$(curl -sS -w '\n%{http_code}' -X POST https://api.vercel.com/login/oauth/token             --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data 'client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD'             --data 'subject_token_type=urn:ietf:params:oauth:token-type:id_token'             --data 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode 'team_id_or_slug=team_6ukeAMsNaWMRhHombsc7EIwn'             --data-urlencode "subject_token=$OIDC_TOKEN")"
          STATUS="$(printf '%s' "$OUT" | tail -n1)"
          BODY="$(printf '%s' "$OUT" | sed '$d')"
          if [ "$STATUS" != "200" ]; then
            printf 'Vercel token exchange failed HTTP %s: %s\n' "$STATUS" "$BODY"
            exit 1
          fi
          TOKEN="$(printf '%s' "$BODY" | jq -r '.access_token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --yes             --token "$TOKEN"             --scope iverfinnes-projects
