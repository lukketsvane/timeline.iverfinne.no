name: Verify infinite Figma garden
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 2 https://max.iverfinne.no/ -o /tmp/page
          grep -q '<title>MAX FUGLESPRENGER</title>' /tmp/page
          grep -q 'GARDEN_FIG_FORMS' /tmp/page
          grep -q 'function drawGrowingFigmaPlant' /tmp/page
          grep -q 'function updateHoldWater' /tmp/page
          grep -q 'waterHold' /tmp/page
          grep -q "WILD_PLANTS=false" /tmp/page
          echo SOURCE_OK
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:390,height:844},
              hasTouch:true,isMobile:true,deviceScaleFactor:3
            });
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res&&res.status()));
            await page.waitForTimeout(3000);
            if((await page.title())!=='MAX FUGLESPRENGER')throw new Error('title');
            const ui=await page.evaluate(()=>({
              title:getComputedStyle(document.querySelector('#gameTitle')).display,
              blast:getComputedStyle(document.querySelector('#blastHud')).display,
              garden:getComputedStyle(document.querySelector('#gardenHud')).display,
              hint:getComputedStyle(document.querySelector('#gardenHint')).display,
              round:getComputedStyle(document.querySelector('#roundHud')).display,
              perkBottom:getComputedStyle(document.querySelector('#perkMenu')).bottom,
              canvas:[document.querySelector('#c').width,document.querySelector('#c').height]
            }));
            console.log('UI',JSON.stringify(ui));
            if([ui.title,ui.blast,ui.garden,ui.hint,ui.round].some(x=>x!=='none'))throw new Error('text HUD visible');

            // Exercise movement/touch paths on the iPhone-sized viewport.
            await page.keyboard.down('ArrowRight');await page.waitForTimeout(1500);await page.keyboard.up('ArrowRight');
            await page.keyboard.press('ArrowUp');await page.waitForTimeout(700);
            const b=await page.locator('#stage').boundingBox();if(!b)throw new Error('stage');
            await page.mouse.move(b.x+b.width*.56,b.y+b.height*.66);
            await page.mouse.down();await page.waitForTimeout(900);await page.mouse.up();
            await page.waitForTimeout(1000);
            console.log('ERRORS',JSON.stringify(errors));
            if(errors.length)throw new Error(errors.join('\n'));
            await page.screenshot({path:'fuglesprenger-garden.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuglesprenger-garden-verification
          path: fuglesprenger-garden.png
          if-no-files-found: ignore
