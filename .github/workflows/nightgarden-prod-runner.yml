name: Verify swan and blast fixes
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 https://max.iverfinne.no/ -o /tmp/page
          grep -q '<title>MAX FUGLESPRENGER</title>' /tmp/page
          grep -q 'function retirePond' /tmp/page
          grep -q 'if(pond&&!pondHasSwans(pond))retirePond(pond,55)' /tmp/page
          grep -q 'Irregular circular shock ring made from pixels' /tmp/page
          ! grep -A30 'function drawBirdBlasts' /tmp/page | grep -q 'strokeRect'
          echo "SOURCE_FIXES_OK"
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage(), errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const r=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||r.status()!==200)throw new Error('HTTP '+(r&&r.status()));
            await page.waitForTimeout(2500);
            const box=await page.locator('#stage').boundingBox();
            if(!box)throw new Error('stage missing');
            for(let i=0;i<20;i++){
              await page.mouse.click(box.x+box.width*(.15+(i%5)*.17),box.y+box.height*(.38+Math.floor(i/5)*.09));
              await page.waitForTimeout(45);
            }
            await page.waitForTimeout(1200);
            console.log('TITLE',await page.title());
            console.log('ERRORS',JSON.stringify(errors));
            if(errors.length)throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
