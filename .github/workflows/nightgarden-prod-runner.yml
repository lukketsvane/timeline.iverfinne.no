name: Inspect max DNS
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "MAX A"; dig +short A max.iverfinne.no
          echo "MAX CNAME"; dig +short CNAME max.iverfinne.no
          echo "RANDOM A"; dig +short A random-check-987.iverfinne.no
          echo "RANDOM CNAME"; dig +short CNAME random-check-987.iverfinne.no
          echo "TIMELINE"; dig +short CNAME timeline.iverfinne.no; dig +short A timeline.iverfinne.no
          echo "MAX HTTPS"; curl -sSIL --max-time 10 https://max.iverfinne.no | head -30
