name: Verify MAX FUGLESPRENGER
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 https://max.iverfinne.no/ -o /tmp/page
          grep -q '<title>MAX FUGLESPRENGER</title>' /tmp/page
          grep -q 'function blastBirdAt' /tmp/page
          grep -q 'MAX FUGLESPRENGER' /tmp/page
          echo "SOURCE_OK"
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage(), errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res&&res.status()));
            await page.waitForTimeout(2600);
            if((await page.title())!=='MAX FUGLESPRENGER')throw new Error('wrong title');
            const titleText=await page.locator('#gameTitle').innerText();
            if(titleText!=='MAX FUGLESPRENGER')throw new Error('missing title card');
            const box=await page.locator('#stage').boundingBox();
            if(!box)throw new Error('no stage');
            for(let y=.42;y<=.72;y+=.10)for(let x=.18;x<=.82;x+=.16){await page.mouse.click(box.x+box.width*x,box.y+box.height*y);await page.waitForTimeout(70);}
            await page.waitForTimeout(800);
            console.log('TITLE',await page.title());
            console.log('HUD',titleText);
            console.log('ERRORS',JSON.stringify(errors));
            if(errors.length)throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
