name: Verify seed roguelite
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage(), errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{ if(m.type()==='error') errors.push('CONSOLE '+m.text()); });
            let res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200) throw new Error('HTTP '+(res&&res.status()));
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(1600);
            const title=await page.title();
            if(title!=='MAX FUGLESPRENGER') throw new Error('wrong title '+title);
            let hud=await page.locator('#gardenHud').innerText();
            console.log('HUD_START',JSON.stringify(hud));
            if(!/FRØ\s+0/.test(hud)||!/PLANTER\s+0/.test(hud)) throw new Error('run did not start empty');

            await page.keyboard.down('ArrowRight');
            await page.waitForTimeout(1800);
            await page.keyboard.up('ArrowRight');
            await page.waitForTimeout(1000);

            hud=await page.locator('#gardenHud').innerText();
            const save=await page.evaluate(()=>localStorage.getItem('max-fuglesprenger-rogue-v2'));
            console.log('HUD_AFTER_MOVE',JSON.stringify(hud));
            console.log('SAVE',save);
            if(!save) throw new Error('no v2 run save after seed collection');
            const parsed=JSON.parse(save);
            if(!(parsed.seeds>0)) throw new Error('guaranteed seed was not collected');
            if(parsed.plots.length!==0) throw new Error('world did not remain unplanted before player plants');
            if(errors.length) throw new Error(errors.join('\n'));
            await page.screenshot({path:'seed-roguelite.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-roguelite-verification
          path: seed-roguelite.png
          if-no-files-found: ignore
