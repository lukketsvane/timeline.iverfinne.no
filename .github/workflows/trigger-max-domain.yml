name: Trigger max domain attachment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-max-domain.yml'

permissions:
  contents: read
  id-token: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token)

      - name: Call protected Vercel route
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl -sS -i \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
            https://timeline.iverfinne.no/api/_max-domain
